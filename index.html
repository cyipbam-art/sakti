// ===== Lapisan data: memori (preview) atau Firestore (produksi) =====
function memDB(){const d={users:[],siswa:[],kelas:[],absensi:[],settings:[],izinManual:[]},ls={};
 const fl=(c,w=[])=>d[c].filter(x=>w.every(([f,o,v])=>o=='=='?x[f]==v:o=='>='?x[f]>=v:x[f]<=v)).map(x=>({...x}));
 const emit=c=>(ls[c]||[]).forEach(([f,w])=>f(fl(c,w)));
 const put=(c,id,v)=>{const i=d[c].findIndex(x=>x.id==id);if(i<0)d[c].push({...v,id});else d[c][i]={...d[c][i],...v,id}};
 return{ts:()=>new Date(),q:async(c,w)=>fl(c,w),get:async(c,id)=>{const x=d[c].find(y=>y.id==id);return x?{...x}:null},
  sub:(c,f,w=[])=>{(ls[c]=ls[c]||[]).push([f,w]);f(fl(c,w));return()=>{ls[c]=ls[c].filter(x=>x[0]!==f)}},
  set:async(c,id,v)=>{put(c,id,v);emit(c)},
  add:async(c,v)=>{put(c,'m'+Math.random().toString(36).slice(2,9),v);emit(c)},
  del:async(c,id)=>{d[c]=d[c].filter(x=>x.id!=id);emit(c)},
  delMany:async(c,ids)=>{d[c]=d[c].filter(x=>!ids.includes(x.id));emit(c)},
  batch:async ops=>{ops.forEach(([c,id,v])=>put(c,id,v));[...new Set(ops.map(o=>o[0]))].forEach(emit)},
  create:async(c,id,v)=>{if(d[c].some(x=>x.id==id))return false;put(c,id,v);emit(c);return true},
  setIf:async(c,id,k,v)=>{const x=d[c].find(y=>y.id==id);if(!x)return'none';if(x[k])return'dup';x[k]=v;emit(c);return'ok'}}}
async function fbDB(){const u='https://www.gstatic.com/firebasejs/10.12.2/';
 const [A1,F,U]=await Promise.all([import(u+'firebase-app.js'),import(u+'firebase-firestore.js'),import(u+'firebase-auth.js')]);
 const app=A1.initializeApp(firebaseConfig),db=F.getFirestore(app),au=U.getAuth(app);
 const Q=(c,w=[])=>F.query(F.collection(db,c),...w.map(x=>F.where(...x)));
 const chunks=(a,n)=>{const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o};
 return{ts:()=>F.serverTimestamp(),auth:(e,p)=>U.signInWithEmailAndPassword(au,e,p),out:()=>U.signOut(au),
  restore:()=>new Promise(r=>{const un=U.onAuthStateChanged(au,x=>{un();r(x)})}),
  q:async(c,w)=>(await F.getDocs(Q(c,w))).docs.map(x=>({...x.data(),id:x.id})),
  get:async(c,id)=>{const s=await F.getDoc(F.doc(db,c,id));return s.exists()?{...s.data(),id:s.id}:null},
  sub:(c,f,w)=>F.onSnapshot(Q(c,w),s=>f(s.docs.map(x=>({...x.data({serverTimestamps:'estimate'}),id:x.id}))),()=>toast('Gagal memuat '+c+'. Periksa Security Rules.')),
  set:(c,id,v)=>F.setDoc(F.doc(db,c,id),v,{merge:true}),add:(c,v)=>F.addDoc(F.collection(db,c),v),del:(c,id)=>F.deleteDoc(F.doc(db,c,id)),
  batch:async ops=>{for(const g of chunks(ops,400)){const b=F.writeBatch(db);g.forEach(([c,id,v])=>b.set(F.doc(db,c,id),v,{merge:true}));await b.commit()}},
  delMany:async(c,ids)=>{for(const g of chunks(ids,400)){const b=F.writeBatch(db);g.forEach(id=>b.delete(F.doc(db,c,id)));await b.commit()}},
  create:(c,id,v)=>F.runTransaction(db,async t=>{const r=F.doc(db,c,id),s=await t.get(r);if(s.exists())return false;t.set(r,v);return true}),
  setIf:(c,id,k,v)=>F.runTransaction(db,async t=>{const r=F.doc(db,c,id),s=await t.get(r);if(!s.exists())return'none';if(s.data()[k])return'dup';t.update(r,{[k]:v});return'ok'})}}

A.login=async()=>{const u=$('#lu').value.trim(),p=$('#lp').value;err('');if(!DB)return err('Database belum siap.');
 if(Date.now()<lockUntil)return err('Terlalu banyak percobaan. Coba lagi dalam '+Math.ceil((lockUntil-Date.now())/1000)+' detik.');
 try{if($('#lt').value=='a'){if(IS_PREVIEW){if(u!='admin@sakti.sch'||p!='admin123')throw 0}else await DB.auth(u,p);me={role:'admin',nama:'Administrator',id:'admin'}}

// Lingkaran persentase (SVG) terbagi per status
const ring=(c,tot)=>{const R=54,C=2*Math.PI*R;let off=0;
 const segs=['hadir','terlambat','dispensasi','izin','sakit'].map(k=>{const len=tot?c[k]/tot*C:0;const s=len>0?`<circle cx="70" cy="70" r="${R}" fill="none" stroke="${ST[k][1]}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`:'';off+=len;return s}).join('');
 const p=tot?Math.round(hdr(c)/tot*100):0;
 return`<svg class="rg" viewBox="0 0 140 140" role="img" aria-label="Kehadiran ${p} persen"><circle cx="70" cy="70" r="${R}" fill="none" stroke="#E2EAF6" stroke-width="16"/>${segs}<text x="70" y="78" text-anchor="middle" font-size="26" fill="#0F172A">${p}%</text></svg>`};

const beep=ok=>{try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator();o.frequency.value=ok?880:200;o.connect(c.destination);o.start();o.stop(c.currentTime+(ok?.12:.4))}catch{}};
const hav=(a,b,c,d)=>{const f=x=>x*Math.PI/180,x=Math.sin(f(c-a)/2)**2+Math.cos(f(a))*Math.cos(f(c))*Math.sin(f(d-b)/2)**2;return 12742e3*Math.asin(Math.sqrt(x))};
const geoOK=()=>new Promise(r=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{const c=cfg(),d=hav(p.coords.latitude,p.coords.longitude,+c.lat,+c.lng),ok=d<=+c.radiusM;r([ok,ok?`📍 Di area sekolah (${Math.round(d)} m)`:`⛔ Di luar area sekolah (${Math.round(d)} m)`])},()=>r([false,'⛔ Lokasi tidak bisa dibaca']),{enableHighAccuracy:true,timeout:10000}):r([false,'⛔ GPS tidak didukung']));

const explain=e=>{const t=String(e?.name||'')+' '+String(e?.message||e||'');let m;
 if(/NotAllowed|Permission|denied|SecurityError/i.test(t))m='Izin kamera ditolak. Ketuk ikon gembok/kamera di address bar, izinkan kamera, lalu tekan "Coba lagi".';
 else if(/NotFound|DevicesNotFound|no camera|Requested device not found/i.test(t))m='Kamera tidak ditemukan pada perangkat ini.';
 else if(/NotReadable|TrackStart|in use|Could not start video/i.test(t))m='Kamera sedang dipakai aplikasi atau tab lain. Tutup yang lain lalu coba lagi.';
 else m='Kamera gagal dibuka ('+H(t.trim().slice(0,80))+').';
 if(inFrame)m+='<br>Aplikasi sedang tampil di dalam bingkai (embed), sehingga izin kamera sering diblokir. Buka di tab baru.';
 if(inApp)m+='<br>Anda memakai browser di dalam aplikasi lain. Buka lewat Chrome atau Safari.';
 return m};

async function openCam(){await stopCam();const rd=$('#reader');if(!rd)return;const w=camBlock();if(w)return camMsg(w);

  try{camera=new Html5Qrcode('reader');await camera.start(t,{fps:10,qrbox:q=>{const z=Math.floor(Math.min(q.width,q.height)*.75);return{width:z,height:z}}},c=>A.sc(c),()=>{});

 scan:{t:'Layar Scanner',r(){return`<div class="sg"><div class="card"><div class="row" style="justify-content:space-between"><b>Tempelkan kartu pelajar ke kamera</b><button class="btn nf" onclick="A.full()">Tampilan penuh (F)</button></div><div id="fr"></div><div id="reader"></div><div class="row" style="margin-top:10px"><button class="btn s" id="cs" style="display:none" onclick="A.cs()">🔄 Ganti kamera</button><button class="btn s" onclick="A.rc()">↻ Muat ulang kamera</button><button class="btn s" onclick="A.pq()">🖼 Scan dari foto</button><input id="qf" type="file" accept="image/*" hidden onchange="A.qf(this.files[0]);this.value=''"></div><div id="qrtmp" hidden></div><div id="gps" class="chip"></div><input id="mi" placeholder="Cadangan: ketik atau scan NISN lalu Enter" onkeydown="if(event.key=='Enter'){A.sc(this.value);this.value=''}"><div id="res" class="res"></div></div><div class="card"><h3>Sudah absen: <span id="cnt"></span></h3><div id="feed"></div></div></div>`},after(){startCam();updScan()}},
 abs:{t:'Absensi Hari Ini',live:1,r(){const{m,a}=sum(),L=a.filter(s=>(!ak||s.kelasId==ak)&&(!aq||s.nama.toLowerCase().includes(aq)||String(s.nisn).includes(aq))).sort(byN);
  return`<div class="card"><div class="row"><select onchange="A.ak(this.value)"><option value="">Semua kelas</option>${sel(kOpts(),ak)}</select><input placeholder="Cari nama / NISN lalu Enter" value="${H(aq)}" onchange="A.aq(this.value)"></div>${tbl(['Nama','Kelas','Status','Masuk','Pulang',''],L.map(s=>{const r=m[s.id];return[H(s.nama),kn(s.kelasId),r?badge(st(r)):'<small>Belum tercatat</small>',r?fmt(r.jamMasuk):'-',r?fmt(r.jamPulang):'-',`<button class="btn s" onclick="A.ab('${s.id}')">Izin / Koreksi</button> <button class="btn s" onclick="A.rw('${s.id}')">Riwayat</button>`]}))}</div>`}},
 siswa:{t:'Data Siswa',live:1,r(){const L=S.siswa.filter(x=>!fk||x.kelasId==fk).sort(byN);return`<div class="card"><div class="row"><select onchange="A.fk(this.value)"><option value="">Semua kelas</option>${sel(kOpts(),fk)}</select><button class="btn p" onclick="A.ad('siswa')">+ Tambah</button><button class="btn" onclick="A.pick()">Impor Excel/CSV</button><input id="fi" type="file" hidden accept=".xlsx,.xls,.csv" onchange="A.imp(this.files[0]);this.value=''"><button class="btn" onclick="A.tpl()">Template</button><button class="btn" onclick="A.exm()">Export Excel</button><button class="btn" onclick="A.qm()">Export QR Code</button></div>${tbl(['NISN','Nama','Kelas','Status',''],L.map(s=>[H(s.nisn),H(s.nama),kn(s.kelasId),s.aktif===false?'Nonaktif':'Aktif',`<button class="btn s" onclick="A.rw('${s.id}')">Riwayat</button> <button class="btn s" onclick="A.qs('${s.id}')">QR</button> `+act('siswa',s.id)]))}</div>`}},
 users:{t:'Data Guru',live:1,r(){return`<div class="card"><div class="row"><button class="btn p" onclick="A.ad('users')">+ Tambah</button></div>${tbl(['NIP','Nama','Peran','Status',''],S.users.map(u=>[H(u.username||u.id),H(u.nama),u.role=='piket'?'Guru Piket':'Wali Kelas',u.aktif===false?'Nonaktif':'Aktif',act('users',u.id)]))}</div>`}},
 kelas:{t:'Kelas & Jurusan',live:1,r(){return`<div class="card"><div class="row"><button class="btn p" onclick="A.ad('kelas')">+ Tambah</button></div>${tbl(['Kelas','Tingkat','Wali kelas','Siswa',''],S.kelas.map(k=>[H(k.nama),H(k.tingkat),H(S.users.find(u=>u.id==k.waliKelasId)?.nama||'-'),S.siswa.filter(s=>s.kelasId==k.id).length,act('kelas',k.id)]))}</div>`}},
 rekap:{t:'Rekap Kehadiran',r(){const ks=me.role=='walikelas'?S.kelas.filter(k=>k.waliKelasId==me.id):S.kelas;
  return`<div class="card"><div class="row"><input type="month" id="bln" value="${curDay.slice(0,7)}"><select id="rk">${me.role=='admin'?'<option value="">Semua kelas</option>':''}${sel(ks.map(k=>[k.id,k.nama]),'')}</select><button class="btn p" onclick="A.rk()">Tampilkan</button>${me.role=='admin'?'<button class="btn" onclick="A.rx()">Export Excel</button>':''}</div><div id="rt"><p class="empty">Pilih bulan dan kelas.</p></div></div>`},after(){if(me.role=='walikelas'){if(ready()){rkAuto=true;A.rk()}else $('#rt').innerHTML='<p class="empty">Memuat data…</p>'}}},
 man:{t:'Absen Manual',r(){return`<div class="two"><div class="card"><h3>Data absensi manual</h3><label>Status</label><select id="mst">${sel([['izin','Izin'],['sakit','Sakit'],['dispensasi','Dispensasi'],['hadir','Hadir (manual, hari ini)']],'izin')}</select><label>Dari tanggal</label><input type="date" id="mda" value="${curDay}"><label>Sampai tanggal (kosong = 1 hari)</label><input type="date" id="mdb"><label>Keterangan</label><input id="mkt" maxlength="200" placeholder="Contoh: sakit demam, surat dari orang tua"><p class="chip" id="mc"></p><button class="btn p w" onclick="A.msv()">Simpan untuk siswa terpilih</button><h3 style="margin-top:16px">Tercatat manual hari ini</h3><div id="mh"></div></div><div class="card"><div class="row"><select onchange="A.mk(this.value)"><option value="">Pilih kelas</option>${sel(kOpts(),mk)}</select><input placeholder="Cari nama / NISN" value="${H(mq)}" onchange="A.mq(this.value)"></div><div id="ml"></div></div></div>`},after(){mUp()}},
 kal:{t:'Kalender Libur',live:1,r(){const y=cm.getFullYear(),mo=cm.getMonth(),n=new Date(y,mo+1,0).getDate(),C={n:'#EF4444',c:'#F59E0B',s:'#8B5CF6',w:'#94A3B8'},cells=[],list=[];
  for(let i=0;i<new Date(y,mo,1).getDay();i++)cells.push('<div></div>');
  for(let d=1;d<=n;d++){const s=y+'-'+pad(mo+1)+'-'+pad(d),o=offDay(s),k=o?C[o.t]:'';if(o&&o.t!='w')list.push(`<div class="fi"><span>${d} ${BLN[mo]}</span><span class="bdg" style="background:${k}22;color:${k}">${H(o.n)}</span></div>`);cells.push(`<div class="cd${s==curDay?' td':''}"${o?` style="background:${k}22;color:${k}"`:''}>${d}</div>`)}
  return`<div class="card"><div class="row" style="justify-content:space-between"><button class="btn" onclick="A.cn(-1)">‹</button><b>${BLN[mo]} ${y}</b><button class="btn" onclick="A.cn(1)">›</button></div><div class="cal">${['Min','Sen','Sel','Rab','Kam','Jum','Sab'].map(x=>`<small>${x}</small>`).join('')}${cells.join('')}</div><p class="chip"><span style="color:#EF4444">● Libur nasional</span> · <span style="color:#F59E0B">● Cuti bersama</span> · <span style="color:#8B5CF6">● Libur sekolah</span> · <span style="color:#94A3B8">● Akhir pekan</span></p>${LN[y]?'':`<div class="pv">Libur keagamaan ${y} belum ada di data bawaan (hanya libur tetap). Tambahkan manual di Pengaturan.</div>`}<h3>Libur bulan ini</h3>${list.join('')||'<p class="empty">Tidak ada hari libur</p>'}<small>Sumber data: SKB 3 Menteri tahun 2026 dan 2027.</small></div>`}},
 set:{t:'Pengaturan Sekolah',r(){const c=cfg();return`<div class="card" style="max-width:560px">${SF.map(f=>inp('s_',f,c[f[0]])).join('')}<div class="row" style="margin-top:16px"><button class="btn" onclick="A.gps()">Gunakan lokasi saya</button><button class="btn p" onclick="A.sset()">Simpan pengaturan</button></div></div>`}}};

(async()=>{
 try{navigator.serviceWorker?.register(URL.createObjectURL(new Blob(["self.addEventListener('fetch',()=>{})"],{type:'text/javascript'}))).catch(()=>{})}catch{}
 if(IS_PREVIEW){DB=memDB();await seed();$('#lpv').innerHTML='<div class="pv"><b>MODE PREVIEW</b> (data di memori)<br>Admin: admin@sakti.sch / admin123<br>Piket: 1980 / piket123<br>Wali kelas: 1981 / wali123<br>Simulasi scan: ketik 1001 atau 1002 di kolom cadangan.</div>'+frameNote()}
 else{try{DB=await fbDB()}catch(e){err('Firebase gagal dimuat. Periksa firebaseConfig dan koneksi.');return}
  $('#lpv').innerHTML=frameNote();
  try{const u=await DB.restore();if(u){me={role:'admin',nama:'Administrator',id:'admin'};start()}}catch{}}
})();
