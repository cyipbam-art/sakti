<style>
:root{--c1:#5B6EF5;--c2:#6CB8F5;--c3:#9B7BF0;--cd:#3B4BD8;--bg:#E9EEFF;--t:#0F1B4D;--m:#5F6B94;--bo:color-mix(in srgb,var(--c1) 14%,transparent);--card:rgba(255,255,255,.6);--ok:#16A34A;--wr:#F59E0B;--er:#E11D48;--sh:0 10px 40px color-mix(in srgb,var(--c1) 12%,transparent);--g:linear-gradient(135deg,var(--c1),var(--c3))}
*{box-sizing:border-box;margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg) linear-gradient(180deg,#CFE8FB,#EAF5FE 45%,#E4F2FD) fixed;color:var(--t);font-size:14px;min-height:100vh}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{display:none;min-height:100vh}
/* sidebar */
#sb{width:248px;background:linear-gradient(170deg,var(--cd),var(--c1) 70%,#1597D6);color:#fff;padding:20px 14px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;gap:6px;transition:transform .25s;z-index:5;overflow:hidden}
#sb::after{content:"";position:absolute;right:-90px;bottom:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(74,222,128,.55),transparent 70%);pointer-events:none}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}.brand b{font-size:18px;display:block;line-height:1.1}.brand small{opacity:.8;font-size:11px;display:block;margin-top:2px;max-width:150px}
#nv{display:grid;gap:3px;overflow:auto;position:relative;z-index:1}
.ni{display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:14px;cursor:pointer;color:#fff;background:none;border:0;font-size:14px;font-weight:600;text-align:left;width:100%}
.ni:hover{background:rgba(255,255,255,.14)}.ni.on{background:rgba(255,255,255,.95);color:var(--c1);box-shadow:0 6px 16px rgba(0,0,0,.12)}
.ni.lo{margin-top:auto;position:relative;z-index:1;background:rgba(255,255,255,.12)}
#mn{margin-left:248px;padding:0 28px 24px;transition:margin .25s;min-width:0;width:100%}
#tb{display:flex;align-items:center;gap:12px;padding:16px 0;position:sticky;top:0;background:rgba(228,242,253,.78);backdrop-filter:blur(14px);z-index:4}
#tb h1{font-size:20px;flex:1;font-weight:800}#clk{font-weight:700;color:var(--c1);font-variant-numeric:tabular-nums}
.who{background:#fff;border-radius:99px;padding:6px 14px;font-weight:600;box-shadow:var(--sh);font-size:13px}
.qchip{background:#FEF3C7;color:#92400E;border-radius:99px;padding:6px 12px;font-weight:700;font-size:12px;display:none;align-items:center;gap:6px;border:0;cursor:pointer}
#xf{display:none}
body.hs #sb{transform:translateX(-100%)}body.hs #mn{margin-left:0}
body.full #sb,body.full #bn,body.full .nf{display:none}body.full #mn{margin-left:0}body.full #xf{display:inline-block}
#ft{text-align:center;color:var(--m);font-size:12px;padding:20px 0 0}
/* komponen */
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);border-radius:24px;box-shadow:var(--sh);padding:18px;margin-bottom:16px}
.card h3{font-size:16px;font-weight:800;margin-bottom:4px}
.btn{border:1px solid var(--bo);background:#fff;border-radius:99px;padding:9px 16px;cursor:pointer;font-weight:700;color:var(--t);font-size:13px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--c2)}
.btn.p{background:var(--g);color:#fff;border-color:transparent;box-shadow:0 8px 18px rgba(29,111,242,.28)}.btn.p.dg{background:var(--er);box-shadow:none}
.btn.s{padding:5px 12px;font-size:12px}.btn.d{color:var(--er)}.btn.w{width:100%}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,.ni:focus-visible{outline:3px solid var(--c2);outline-offset:1px}
input,select,textarea{border:1px solid var(--bo);border-radius:14px;padding:10px 14px;font-size:14px;width:100%;background:#fff;color:var(--t)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.row input,.row select{width:auto;flex:1;min-width:130px}
label{display:block;font-size:12px;color:var(--m);margin:12px 0 4px;font-weight:700}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}
th{color:var(--m);font-size:12px;text-align:left;padding:8px;font-weight:700;white-space:nowrap}td{padding:10px 8px;border-top:1px solid var(--bo)}
tr:hover td{background:rgba(34,184,240,.06)}
.empty{color:var(--m);text-align:center;padding:24px}
.bdg{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px}
.grid .card{margin:0;padding:14px 16px}.grid small{color:var(--m);font-weight:600}.big{display:block;font-size:36px;line-height:1.2;font-weight:800}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.rg{width:170px;height:170px;margin:auto;display:block}.rg text{font-weight:800}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;font-size:12px;margin:10px 0}
.bar{position:relative;height:8px;background:var(--bo);border-radius:9px;overflow:hidden;margin:4px 0 12px}
.bar i{position:absolute;left:0;top:0;height:100%;background:var(--g);border-radius:9px}.bar i.l{background:#BFDFFB}
.hero{position:relative;overflow:hidden;background:linear-gradient(125deg,var(--cd),var(--c1) 55%,var(--c2));color:#fff;border-radius:28px;padding:24px 26px 62px;margin-bottom:-38px}
.hero::before{content:"";position:absolute;right:-60px;top:-90px;width:300px;height:300px;border-radius:50%;background:linear-gradient(160deg,var(--c3),var(--c2));opacity:.85}
.hero>*{position:relative}.hero h2{font-size:24px;font-weight:800}.hero .pv{background:rgba(255,255,255,.2);color:#fff}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin:0 14px 18px;position:relative;z-index:2}
.qa button{background:rgba(255,255,255,.88);backdrop-filter:blur(14px);border:1px solid #fff;border-radius:22px;box-shadow:var(--sh);padding:14px 8px;display:grid;place-items:center;gap:8px;font-weight:700;font-size:12px;cursor:pointer;color:var(--t)}
.qa .ti{width:46px;height:46px;border-radius:16px;background:linear-gradient(145deg,#C8E6FD,#CDF5DB);display:grid;place-items:center;color:var(--c1)}
.sg{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:start}
#reader{border-radius:22px;overflow:hidden;min-height:200px;background:#0b1f3a0d}
.chip{margin:10px 0;font-weight:700;color:var(--cd)}
.res{margin-top:12px;border-radius:22px;padding:20px;text-align:center;min-height:130px;display:grid;place-content:center}
.res b{font-size:32px}.res.ok{background:#D1FAE5;color:#065F46}.res.warn{background:#FEF3C7;color:#92400E}.res.info{background:#DBEAFE;color:#1E40AF}.res.bad{background:#FEE2E2;color:#991B1B}
.fi{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--bo);align-items:center}
.mo{position:fixed;inset:0;background:rgba(11,31,58,.42);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:20;padding:16px}
.mc{background:rgba(255,255,255,.96);border-radius:26px;padding:22px;width:100%;max-width:440px;max-height:90vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.25)}.mc.wd{max-width:620px}
.mc h3{font-size:18px;font-weight:800}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--cd);color:#fff;padding:10px 18px;border-radius:99px;z-index:30;max-width:92vw;text-align:center;font-weight:600;box-shadow:0 10px 24px rgba(0,0,0,.2)}
.pv{background:#FEF3C7;color:#92400E;border-radius:14px;padding:8px 12px;font-size:12px}
.fr{background:#FEF3C7;color:#92400E;border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;margin:12px 0}.cal small{color:var(--m);font-weight:700}.cd{padding:10px 0;border-radius:12px;font-weight:700;background:rgba(255,255,255,.7)}.cd.td{outline:2px solid var(--c1)}
.lg{position:relative;display:inline-grid;place-items:center;border-radius:14px;overflow:hidden;background:var(--g);color:#fff;font-weight:800;flex:none}
.lg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.sec{font-size:13px;font-weight:800;color:var(--c1);margin:20px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.sec:first-child{margin-top:0}
.sw{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}.sw button{width:46px;height:46px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--bo);cursor:pointer}.sw button.on{box-shadow:0 0 0 3px var(--c1)}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1}
.trend svg{width:100%;height:auto;display:block}
details summary{cursor:pointer;color:var(--m);font-size:12px;margin-top:6px}
#bn{display:none}#pa{display:none}
/* ===== tema kaca pastel ===== */
body{background:linear-gradient(135deg,color-mix(in srgb,var(--c2) 13%,#fff),color-mix(in srgb,var(--c1) 15%,#fff) 48%,color-mix(in srgb,var(--c3) 14%,#fff)) fixed}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(520px 420px at 8% 12%,color-mix(in srgb,var(--c2) 38%,transparent),transparent 70%),radial-gradient(560px 460px at 92% 18%,color-mix(in srgb,var(--c3) 30%,transparent),transparent 70%),radial-gradient(520px 420px at 70% 96%,color-mix(in srgb,var(--c1) 22%,transparent),transparent 70%)}
#sb{inset:16px auto 16px 16px;width:232px;border-radius:28px;background:rgba(255,255,255,.55);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.8);box-shadow:var(--sh);color:var(--m);padding:18px 12px}
#sb::after{display:none}
.brand b{color:var(--t)}.brand small{opacity:1;color:var(--m)}
.ni{color:var(--m);border-radius:16px}.ni:hover{background:rgba(255,255,255,.6);color:var(--c1)}
.ni.on{background:rgba(255,255,255,.9);color:var(--c1);box-shadow:0 6px 18px color-mix(in srgb,var(--c1) 16%,transparent),inset 0 0 0 1px rgba(255,255,255,.9)}
.ni.lo{background:none;margin-top:auto}.ni.lo:hover{background:rgba(225,29,72,.08);color:var(--er)}
#mn{margin-left:264px;padding:0 28px 24px 12px}
#tb{background:transparent;backdrop-filter:none;padding:18px 0 10px}
#tb h1{font-size:15px;font-weight:700;color:var(--m)}
#clk{background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.85);border-radius:99px;padding:7px 14px;font-size:13px}
.who{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.85);backdrop-filter:blur(16px);padding:5px 14px 5px 5px;border-radius:99px}
.who b{display:block;font-size:13px;line-height:1.2;color:var(--t)}.who small{display:block;font-size:11px;color:var(--m);font-weight:600}
.av{width:34px;height:34px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.card{background:var(--card);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.8);border-radius:24px;box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.85);padding:20px;transition:transform .2s,box-shadow .2s}
.card:hover{box-shadow:0 14px 46px color-mix(in srgb,var(--c1) 17%,transparent),inset 0 1px 0 rgba(255,255,255,.85)}
.btn{background:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.9);box-shadow:0 2px 8px color-mix(in srgb,var(--c1) 8%,transparent)}.btn:hover{border-color:var(--c1);color:var(--c1)}
.btn.p{background:var(--g);color:#fff;border-color:transparent;box-shadow:0 10px 22px color-mix(in srgb,var(--c1) 32%,transparent)}.btn.p:hover{color:#fff;filter:brightness(1.05)}
input,select,textarea{background:rgba(255,255,255,.72);border:1px solid color-mix(in srgb,var(--c1) 16%,transparent)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--c1);box-shadow:0 0 0 4px color-mix(in srgb,var(--c1) 14%,transparent)}
tr:hover td{background:color-mix(in srgb,var(--c1) 5%,transparent)}
.mc{background:rgba(255,255,255,.9);backdrop-filter:blur(24px)}
.toast{background:var(--t)}
.dvon{background:color-mix(in srgb,var(--c1) 8%,transparent);border-color:var(--c1);color:var(--cd)}
.sec{color:var(--c1)}
.bar{background:color-mix(in srgb,var(--c1) 12%,transparent)}.bar i.l{background:color-mix(in srgb,var(--c2) 55%,transparent)}
/* dashboard */
.dh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:6px 0 16px}
.dh small{color:var(--m);font-size:14px;font-weight:600}.dh h2{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.15;color:var(--t)}.dh p{color:var(--m);margin-top:4px}
.qa{margin:0 0 16px;display:flex;gap:10px;flex-wrap:wrap}
.qa button{display:flex;flex-direction:row;gap:10px;padding:8px 16px 8px 8px;border-radius:99px;background:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.85);box-shadow:var(--sh);font-size:13px}
.qa .ti{width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--c1) 12%,transparent);color:var(--c1)}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:18px}.kpi .card{margin:0}
.kc .ki{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;margin-bottom:14px}
.kc small{display:block;color:var(--m);font-weight:600;font-size:13px}.kc b{display:block;font-size:30px;font-weight:800;line-height:1.2;margin:2px 0 8px;color:var(--t)}
.kc .dl{font-size:12px;font-weight:700;color:var(--m)}.kc .dl i{font-style:normal;font-weight:800}
.k1 .ki{background:rgba(22,163,74,.13);color:#16A34A}.k2 .ki{background:rgba(245,158,11,.16);color:#D97706}.k3 .ki{background:color-mix(in srgb,var(--c2) 22%,transparent);color:#2563EB}.k4 .ki{background:rgba(242,127,191,.22);color:#DB2777}
.d2{display:grid;grid-template-columns:1.55fr 1fr;gap:18px;margin-bottom:18px;align-items:stretch}.d2.r{grid-template-columns:1fr 1fr}.d2 .card{margin:0}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:12px}.ch h3{flex:1;margin:0}.ch select{width:auto;padding:6px 12px;border-radius:99px;font-size:12px;font-weight:700}

.dnw{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}.dn{width:170px;height:170px}
.dlg{flex:1;min-width:150px;display:grid;gap:9px}.dlg div{display:flex;align-items:center;gap:8px;font-size:13px}.dlg i{width:10px;height:10px;border-radius:50%;flex:none}.dlg span{flex:1;color:var(--m);font-weight:600}.dlg b{min-width:28px;text-align:right}.dlg em{font-style:normal;color:var(--m);font-size:12px;min-width:38px;text-align:right}

.trend svg{max-height:260px}
/* login */
#lg{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden;background:none}

  const src=lb?.items?.length?`Online (${H(lb.sumber||'-')}), ${lb.jumlah||lb.items.length} hari, diperbarui ${lb.updatedAt?D(lb.updatedAt)?.toLocaleDateString('id-ID')||'-':'-'}`:LN[y]?'Data bawaan aplikasi (SKB 3 Menteri)':'Belum ada data keagamaan (hanya libur tetap)';
  const sch=S.liburSekolah.slice().sort((a,b)=>String(a.mulai)<String(b.mulai)?-1:1);
  return`<div class="card"><div class="row" style="justify-content:space-between"><button class="btn" onclick="A.cn(-1)" aria-label="Bulan sebelumnya">‹</button><b>${BLN[mo]} ${y}</b><button class="btn" onclick="A.cn(1)" aria-label="Bulan berikutnya">›</button></div><div class="cal">${['Min','Sen','Sel','Rab','Kam','Jum','Sab'].map(x=>`<small>${x}</small>`).join('')}${cells.join('')}</div><p class="chip"><span style="color:#EF4444">● Libur nasional</span> · <span style="color:#F59E0B">● Cuti bersama</span> · <span style="color:#8B5CF6">● Libur sekolah</span> · <span style="color:#94A3B8">● Akhir pekan</span></p><h3>Libur bulan ini</h3>${list.join('')||'<p class="empty">Tidak ada hari libur</p>'}<small>Sumber data ${y}: ${src}.</small>${me.role=='admin'?`<div class="row" style="margin-top:12px"><button class="btn p" id="luB" onclick="A.lu(${y})">Perbarui libur ${y} dari internet</button></div>`:''}</div>
  <div class="card"><div class="row" style="justify-content:space-between"><h3>Libur sekolah &amp; rentang libur semester</h3>${me.role=='admin'?'<button class="btn p s" onclick="A.ls(\'\')">+ Tambah</button>':''}</div>${tbl(['Nama','Tanggal','Jenis',...(me.role=='admin'?['']:[])],sch.map(x=>[H(x.nama),H(x.mulai)+(x.selesai&&x.selesai!=x.mulai?' s.d. '+H(x.selesai):''),x.jenis=='masuk'?'Masuk khusus':'Libur',...(me.role=='admin'?[`<button class="btn s" onclick="A.ls(${J(x.id)})">Ubah</button> <button class="btn s d" onclick="A.ld(${J(x.id)})">Hapus</button>`]:[])]))}</div>`}},
 bk:{t:'Backup & Data',r(){return`<div class="card"><h3>Backup &amp; pulihkan</h3><p style="color:var(--m);margin:6px 0 12px">Unduh salinan data sebagai file JSON, atau pulihkan dari file backup sebelumnya.</p><div class="row"><button class="btn p" onclick="A.bkm()">Unduh backup</button><button class="btn" onclick="$('#rsi').click()">Pulihkan dari file</button><input id="rsi" type="file" accept=".json,application/json" hidden onchange="A.rsf(this.files[0]);this.value=''"></div></div>

 akun:{t:'Akun Saya',r(){return`<div class="card" style="max-width:460px"><h3>Ganti password</h3><p style="color:var(--m);margin:6px 0">Masuk sebagai <b>${H(me.nama)}</b> (NIP ${H(me.nip||'')}${me.email?', '+H(me.email):''}).</p><label for="pw0">Password lama</label><input type="password" id="pw0" autocomplete="current-password"><label for="pw1">Password baru (min. 6 karakter)</label><input type="password" id="pw1" autocomplete="new-password"><label for="pw2">Ulangi password baru</label><input type="password" id="pw2" autocomplete="new-password" onkeydown="if(event.key=='Enter')A.pw()"><div class="row" style="margin-top:16px"><button class="btn p" id="pwb" onclick="A.pw()">Simpan password</button></div></div>`}}};

// ===== Ikon mata untuk semua kolom password =====
function eyeify(){document.querySelectorAll('input[type=password]:not([data-eye])').forEach(i=>{i.dataset.eye=1;const w=document.createElement('span');w.className='pw';i.parentNode.insertBefore(w,i);w.append(i);
 const b=document.createElement('button');b.type='button';b.className='eye';b.setAttribute('aria-label','Tampilkan password');b.innerHTML=ico('eye');
 b.onclick=()=>{const s=i.type=='password';i.type=s?'text':'password';b.innerHTML=ico(s?'eyeoff':'eye');b.setAttribute('aria-label',s?'Sembunyikan password':'Tampilkan password');i.focus()};w.append(b)})}
new MutationObserver(eyeify).observe(document.body,{childList:true,subtree:true});eyeify();

// ===== Pulihkan sesi login Firebase (admin atau guru) =====
async function resolveSession(u){try{if(await isAdm()){me={role:'admin',nama:u.email,id:'admin'};return start()}
 const em=String(u.email||'').toLowerCase(),r=await DB.get('users',em);
 if(r&&r.aktif!==false&&['piket','walikelas'].includes(r.role)){me={id:r.id,nip:r.nip,role:r.role,nama:r.nama,email:r.email||em};return start()}}catch{}
 try{await DB.fresh()}catch{}}

 else{try{DB=await fbDB()}catch(e){rebuildHol();applyBrand();err('Firebase gagal dimuat. Periksa firebaseConfig dan koneksi.');return}
  let u=null;try{u=await DB.boot()}catch{}

  rebuildHol();applyBrand();$('#lpv').innerHTML=frameNote()+(DB.anonErr=='auth/operation-not-allowed'?'<div class="pv">Aktifkan metode "Anonymous" di Firebase Authentication agar aplikasi dapat membaca data.</div>':'');
